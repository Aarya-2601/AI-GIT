<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · AI-GIT Model Hub</title>
  <link rel="stylesheet" href="auth.css?v=2.6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3C/svg%3E">
</head>
<body class="auth-page">

  <!-- Claude-style Top Left Wordmark -->
  <a href="index.html" class="claude-brand-mark" title="AI-GIT">
    <span class="claude-brand-text">AI-GIT</span>
  </a>

  <div class="auth-page-container">
    <!-- Left Hero Typography with Typewriter Cursor -->
    <div class="auth-hero-left">
      <h1 class="hero-slogan-editorial">
        <span id="typewriterText"></span><span class="typewriter-cursor"></span>
      </h1>
      <p class="hero-subtext-editorial">
        Decentralized, content-addressed version control for multi-gigabyte foundation models and training weights.
      </p>
    </div>

    <!-- Right Offset Transparent Glass Card -->
    <div class="auth-card-right">
      <div class="auth-card">
        <!-- Center Chameleon Logo -->
        <img src="chameleon-logo.png" alt="AI-GIT Logo" class="auth-logo-center">

        <!-- Tag row (Reference Image 2) -->
        <div class="auth-tag-row">
          <span class="auth-portal-tag">PORTAL LOGIN</span>
        </div>

        <h2 class="auth-card-title">Welcome back</h2>
        <p class="auth-card-subtitle">Enter your registered credentials or continue with Google to access AI-GIT Model Hub.</p>

        <!-- Google OAuth Button -->
        <button type="button" class="btn-google-oauth" id="btnGoogleLogin">
          <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span>Login using Google</span>
        </button>

        <div class="auth-card-divider">
          <span>OR CONTINUE WITH EMAIL</span>
        </div>

        <!-- Login Credentials Form -->
        <form id="formLogin" class="auth-form">
          <div class="form-group-wrap">
            <input type="text" class="form-control-input" id="inUserOrEmail" placeholder="Username or Email" required autocomplete="username">
          </div>
          <div class="form-group-wrap">
            <input type="password" class="form-control-input" id="inPassword" placeholder="Password" autocomplete="current-password">
          </div>

          <div id="authAlert" class="auth-alert-box" role="alert"></div>

          <div class="auth-footer-divider"></div>

          <!-- Footer Row (Reference Image 2) -->
          <div class="auth-footer-row">
            <span class="auth-switch-link">
              New here? <a href="signup.html">Create account</a>
            </span>
            <button type="submit" class="btn-pill-submit" id="btnLoginSubmit">
              <span>Log in</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="auth.js?v=2.1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model Repositories & Tree Explorer · AI-GIT</title>
  <link rel="stylesheet" href="repositories.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a855f7'><circle cx='12' cy='12' r='10'/></svg>">
</head>
<body>

  <!-- Top Navigation Placeholder -->
  <div id="aigitTopNav"></div>

  <main class="repos-container">
    <!-- Filter and View Mode Switcher -->
    <section class="repos-control-bar">
      <div class="filter-group">
        <div class="search-input-wrap">
          <input type="text" id="repoFilterSearch" class="form-input" placeholder="Filter by model, family, tag (e.g. llama, vision, gguf)...">
        </div>

        <select class="form-select" id="frameworkFilter" style="width: auto; min-width: 170px;">
          <option value="all">All Formats</option>
          <option value="SafeTensors">SafeTensors (Zero-Copy)</option>
          <option value="GGUF">GGUF (Quantized Edge)</option>
          <option value="PyTorch">PyTorch (.pt / .bin)</option>
          <option value="Raw Binary">Raw Binary</option>
        </select>
      </div>

      <!-- View Switcher: Cards vs Whole Tree Explorer -->
      <div class="view-toggle-wrap" role="tablist" aria-label="Repository View Mode" style="display: flex; gap: 8px; align-items: center;">
        <button type="button" class="btn-primary" id="btnNewRepo" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 14px; text-decoration: none; border-radius: 6px; background: #a855f7; color: #ffffff; border: none; font-weight: 600; cursor: pointer;">
          <span>+ New Repository</span>
        </button>
        <button type="button" class="view-btn active" id="viewModeCards">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Model Cards</span>
        </button>
        <button type="button" class="view-btn" id="viewModeTree">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Whole Tree Explorer</span>
        </button>
      </div>
    </section>

    <!-- VIEW 1: CARDS GRID VIEW -->
    <section class="repos-grid-mode" id="reposGridMode">
      <div style="grid-column: 1/-1; padding: 40px; text-align: center; color: var(--text-muted);">
        Loading AI-GIT repositories...
      </div>
    </section>

    <!-- VIEW 2: SPLIT-PANE WHOLE TREE & DIRECTORY EXPLORER -->
    <section class="repos-tree-mode" id="reposTreeMode" style="display: none;">
      <!-- Left Tree Pane -->
      <aside class="tree-pane-left">
        <div class="tree-pane-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>AI-GIT Model Registry Tree</span>
        </div>
        <ul class="tree-list" id="modelTreeHierarchy">
          <!-- Rendered dynamically by repositories.js -->
        </ul>
      </aside>

      <!-- Right Inspector Pane -->
      <div class="tree-pane-right" id="treeInspectorPane">
        <div style="padding: 40px; text-align: center; color: var(--text-muted);">
          Select a directory or model file from the left tree to inspect contents and FastCDC chunk maps.
        </div>
      </div>
    </section>
  </main>

  <!-- Create Node / Repository Modal -->
  <div id="newRepoModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 99999; align-items: center; justify-content: center; padding: 24px;">
    <div class="modal-container" style="background: #ffffff; border-radius: 14px; max-width: 560px; width: 100%; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); overflow: hidden;">
      <div class="modal-header" style="padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; background: #f8fafc;">
        <div class="modal-title" style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 20px;">📦</span>
          <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: #0f172a;">Create New AI-GIT Repository</h3>
        </div>
        <button type="button" class="modal-close-btn" id="btnCloseNewRepoModal" style="background: transparent; border: none; font-size: 22px; cursor: pointer; color: #64748b;">&times;</button>
      </div>
      <form id="createRepoForm" style="padding: 20px;">
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Repository / Model Name *</label>
          <input type="text" id="newRepoName" class="form-input" placeholder="e.g. llama-3-vision-finetune" required pattern="[A-Za-z0-9._-]+" title="Letters, numbers, dots, hyphens, and underscores only" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 14px;">
          <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Description</label>
          <input type="text" id="newRepoDesc" class="form-input" placeholder="Short description of model weights & architecture..." style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Tensor Framework</label>
            <select id="newRepoFramework" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; box-sizing: border-box;">
              <option value="SafeTensors">SafeTensors (Zero-Copy)</option>
              <option value="GGUF">GGUF (Quantized Edge)</option>
              <option value="PyTorch">PyTorch (.pt / .bin)</option>
              <option value="Raw Binary">Raw Binary</option>
            </select>
          </div>
          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Precision</label>
            <select id="newRepoPrecision" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; box-sizing: border-box;">
              <option value="bfloat16">bfloat16</option>
              <option value="fp16">fp16</option>
              <option value="int4 / Q4_K_M">int4 / Q4_K_M</option>
              <option value="fp8">fp8</option>
              <option value="fp32">fp32</option>
            </select>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" id="btnCancelNewRepo" style="padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; background: #ffffff; cursor: pointer;">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btnSubmitNewRepo" style="padding: 8px 16px; border: none; border-radius: 6px; background: #a855f7; color: #ffffff; font-weight: 600; cursor: pointer;">Create Repository</button>
        </div>
      </form>
    </div>
  </div>

  <script src="nav.js?v=2.7"></script>
  <script src="repositories.js"></script>
</body>
</html>
